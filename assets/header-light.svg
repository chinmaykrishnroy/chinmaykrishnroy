<svg xmlns="http://www.w3.org/2000/svg" width="960" height="222" viewBox="0 0 960 222" role="img" aria-labelledby="title desc">
<title id="title">OneMinute — a conversation-first social app</title>
<desc id="desc">Meet the person before you judge the profile. Private source. Discover, talk, connect. Open the live development preview.</desc>
<style>
.sans {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#182a46}
