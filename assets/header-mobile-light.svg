<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470" role="img" aria-labelledby="title desc">
<title id="title">Chinmay Krishn Roy — Code. Sound. Silicon.</title>
<desc id="desc">A circuit diagram with traveling signals links developer tools, audio, devices, and real-time software. A decorative illustration of the areas I build in.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .signal { animation: travel 7s linear infinite; }
  .s2 { animation-delay: -1.75s; } .s3 { animation-delay: -3.5s; } .s4 { animation-delay: -5.25s; }
  @keyframes travel { from { stroke-dashoffset: 270; } to { stroke-dashoffset: 0; } }
  .core { transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .28; transform: scale(.94); } 50% { opacity: .7; transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .signal, .core { animation: none; } .signal { stroke-dashoffset: 70; } }
</style>
